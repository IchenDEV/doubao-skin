[package]
name = "skin-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native theme core for Doubao and DoubaoWork; model bridge for DoubaoWork"
publish = false

[dependencies]
dirs = "6.0.0"
flate2 = "1.1.10"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
jsonschema = { version = "0.52.1", default-features = false }
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["visitor"] }
parcel_selectors = "=0.28.3"
roxmltree = "0.21.1"
sha2 = "0.11.0"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
