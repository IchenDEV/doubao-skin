name: Release macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Universal macOS package
    runs-on: macos-15
    environment:
      name: production
    env:
      HAS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Validate release tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use semantic versioning, for example v0.1.0" >&2
            exit 1
          fi
          workspace_version=$(awk -F '"' '/^version =/ { print $2; exit }' Cargo.toml)
          if [[ "v$workspace_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $workspace_version" >&2
            exit 1
          fi
      - name: Import Developer ID certificate
        if: ${{ env.HAS_SIGNING_CERTIFICATE == 'true' }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_file="$RUNNER_TEMP/developer-id.p12"
          keychain_file="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_file"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_file"
          security set-keychain-settings -lut 21600 "$keychain_file"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_file"
          security import "$certificate_file" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_file"
          security list-keychain -d user -s "$keychain_file"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_file"
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked
      - name: Build, sign and package
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export APP_VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./scripts/build-macos.sh --universal
      - uses: actions/upload-artifact@v7
        with:
          name: Doubao-Skin-macOS-universal
          path: |
            dist/Doubao-Skin-macOS-universal.zip
            dist/Doubao-Skin-macOS-universal.zip.sha256
            dist/Doubao-Skin-macOS-universal.dmg
            dist/Doubao-Skin-macOS-universal.dmg.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/Doubao-Skin-macOS-universal.zip \
              dist/Doubao-Skin-macOS-universal.zip.sha256 \
              dist/Doubao-Skin-macOS-universal.dmg \
              dist/Doubao-Skin-macOS-universal.dmg.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/Doubao-Skin-macOS-universal.zip \
              dist/Doubao-Skin-macOS-universal.zip.sha256 \
              dist/Doubao-Skin-macOS-universal.dmg \
              dist/Doubao-Skin-macOS-universal.dmg.sha256 \
              --verify-tag \
              --generate-notes \
              --title "Doubao Skin $GITHUB_REF_NAME"
          fi
