[package]
name = "doubao-skin-desktop"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
rust-version.workspace = true
description = "Native desktop app for 豆皮"
publish = false

[[bin]]
name = "doubao-skin-app"
path = "src/main.rs"

[[bin]]
name = "doubao-skin-agent"
path = "src/bin/doubao-skin-agent.rs"

[dependencies]
anyhow = "1.0.104"
skin-core = { path = "../../crates/skin-core" }
log = "0.4.34"
gpui = { git = "https://github.com/zed-industries/zed", rev = "c8e44cfa7bda9b2e22c8d6934d78969352e7f61a" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c8e44cfa7bda9b2e22c8d6934d78969352e7f61a", features = ["runtime_shaders", "font-kit"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "0.2.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.5.3"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[build-dependencies]
embed-resource = "3.0.11"
