[package]
name = "skin-core"
version = "0.1.0"
edition = "2021"
description = "Core library for reskinning the DoubaoWork macOS app (port of doubao_skin)"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
